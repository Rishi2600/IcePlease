# Local development database.
# Usage: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: iceplease-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: iceplease
      POSTGRES_PASSWORD: iceplease
      POSTGRES_DB: iceplease
    ports:
      - "5433:5432"
    volumes:
      - iceplease-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceplease -d iceplease"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  iceplease-db-data:
